replicaCount: 1

frontend:
  image:
    repository: dclaw-offboard-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3044
  ingress:
    enabled: false

backend:
  image:
    repository: dclaw-offboard-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8130
  env:
    OFFBOARD_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/dclaw_offboard"

database:
  name: dclaw_offboard
